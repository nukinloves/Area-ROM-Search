  <title>Area ROM Search</title>

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background: white;

      padding: 25px;

      width: 100%;

      border: 1px solid #dcdfe4;

      background: white;

      transition: 0.2s;

    }

      box-shadow:

    }

    }

       AUTOCOMPLETE
       ========================= */

      left: 0;

      right: 0;

      top: 72px;

      border-radius: 10px;

      box-shadow:

      overflow-y: auto;

      display: none;

    }

      cursor: pointer;

      border-bottom: 1px solid #f1f1f1;

      font-size: 15px;

      transition: 0.15s;

    }


    .suggestion-item:last-child {

      border-bottom: none;

    }


    .suggestion-item:hover {

      background: #f1f5ff;

    }


    .suggestion-empty {

      padding: 12px 15px;

      color: #999;

      font-size: 14px;

    }


    .hint {

      margin-top: 5px;

      font-size: 12px;

      color: #999;

    }


    /* =========================
       BUTTONS
       ========================= */

    .button-row {

      display: flex;

      gap: 10px;

      margin-top: 8px;

    }


    button {

      border: none;

      border-radius: 10px;

      padding: 13px 25px;

      font-size: 16px;

      cursor: pointer;

      transition: 0.2s;

    }


    .search-button {

      background: #4285f4;

      color: white;

      flex: 1;

    }


    .search-button:hover {

      background: #3367d6;

    }


    .clear-button {

      background: #eeeeee;

      color: #333;

    }


    .clear-button:hover {

      background: #dddddd;

    }


    /* =========================
       STATUS
       ========================= */

    .status {

      margin-top: 18px;

      background: white;

      border-radius: 12px;

      padding: 13px 16px;

      font-size: 14px;

      color: #777;

    }


    .status.loading {

      color: #4285f4;

    }


    .status.error {

      color: #dc2626;

      background: #fff5f5;

    }


    /* =========================
       RESULT
       ========================= */

    .result {

      margin-top: 22px;

    }


    .result-header {

      background: white;

      padding: 18px 20px;

      border-radius: 14px;

      margin-bottom: 12px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      box-shadow:
        0 3px 10px rgba(0,0,0,0.05);

    }


    .result-title {

      font-size: 17px;

      font-weight: bold;

    }


    .result-count {

      color: #4285f4;

      font-weight: bold;

    }


    /* =========================
       TEAM CARD
       ========================= */

    .team-card {

      background: white;

      border-radius: 14px;

      padding: 18px 20px;

      margin-bottom: 10px;

      border-left: 5px solid #4285f4;

      box-shadow:
        0 3px 10px rgba(0,0,0,0.05);

    }


    .team-name {

      font-size: 15px;

      font-weight: bold;

      line-height: 1.5;

      word-break: break-word;

    }


    .team-info {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 10px;

    }


    .tag {

      background: #f1f3f6;

      padding: 5px 10px;

      border-radius: 20px;

      font-size: 13px;

      color: #555;

    }


    /* =========================
       EMPTY
       ========================= */

    .empty {

      background: white;

      border-radius: 14px;

      padding: 40px 20px;

      text-align: center;

      color: #888;

      box-shadow:
        0 3px 10px rgba(0,0,0,0.05);

    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .container {

        padding: 12px;

      }


      .header {

        padding: 20px;

      }


      .title {

        font-size: 23px;

      }


      .search-card {

        padding: 20px;

      }


      .button-row {

        flex-direction: column;

      }


      .search-button {

        width: 100%;

      }


      .clear-button {

        width: 100%;

      }


      .result-header {

        padding: 15px;

      }

    }

  </style>

</head>

<script>


/* =========================================================
   GOOGLE SHEET CSV
   ========================================================= */

const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTqZ-wlrqIB2aB4GoLiiUNk946EGiHCo0JZxPnDw08KMofmBs9g8z1L6JD2OYTEFaipCKR_AngY6Qv_/pub?output=csv";



/* =========================================================
   GLOBAL DATA
   ========================================================= */

let allData = [];



/* =========================================================
   ELEMENTS
   ========================================================= */

const regionInput =
  document.getElementById(
    "regionInput"
  );


const districtInput =
  document.getElementById(
    "districtInput"
  );


const subdistrictInput =
  document.getElementById(
    "subdistrictInput"
  );


const regionSuggestions =
  document.getElementById(
    "regionSuggestions"
  );


const districtSuggestions =
  document.getElementById(
    "districtSuggestions"
  );


const subdistrictSuggestions =
  document.getElementById(
    "subdistrictSuggestions"
  );


const searchBtn =
  document.getElementById(
    "searchBtn"
  );


const clearBtn =
  document.getElementById(
    "clearBtn"
  );


const status =
  document.getElementById(
    "status"
  );


const resultArea =
  document.getElementById(
    "resultArea"
  );


const resultCount =
  document.getElementById(
    "resultCount"
  );



/* =========================================================
   NORMALIZE TEXT
   ========================================================= */

function normalize(value) {

  return String(value ?? "")
    .replace(/\u00A0/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();

}



/* =========================================================
   UNIQUE SORT
   ========================================================= */

function uniqueSorted(values) {

  return [
    ...new Set(
      values
        .map(
          value =>
            String(value ?? "").trim()
        )
        .filter(
          value =>
            value !== ""
        )
    )
  ].sort(
    (a, b) =>
      a.localeCompare(
        b,
        "th"
      )
  );

}



/* =========================================================
   CSV PARSER
   รองรับ comma ในข้อความ
   ========================================================= */

function parseCSV(text) {

  const rows = [];

  let row = [];

  let cell = "";

  let insideQuotes = false;


  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    const char =
      text[i];

    const next =
      text[i + 1];


    if (
      char === '"' &&
      insideQuotes &&
      next === '"'
    ) {

      cell += '"';

      i++;

      continue;

    }


    if (char === '"') {

      insideQuotes =
        !insideQuotes;

      continue;

    }


    if (
      char === "," &&
      !insideQuotes
    ) {

      row.push(cell);

      cell = "";

      continue;

    }


    if (
      (
        char === "\n" ||
        char === "\r"
      ) &&
      !insideQuotes
    ) {

      if (
        char === "\r" &&
        next === "\n"
      ) {

        i++;

      }


      row.push(cell);

      cell = "";


      if (
        row.some(
          value =>
            String(value).trim() !== ""
        )
      ) {

        rows.push(row);

      }


      row = [];

      continue;

    }


    cell += char;

  }


  if (
    cell !== "" ||
    row.length > 0
  ) {

    row.push(cell);


    if (
      row.some(
        value =>
          String(value).trim() !== ""
      )
    ) {

      rows.push(row);

    }

  }


  return rows;

}



/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadData() {

  try {


    status.className =
      "status loading";


    status.textContent =
      "กำลังโหลดข้อมูลจาก Google Sheet...";


    const response =
      await fetch(
        CSV_URL +
        "&t=" +
        Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const text =
      await response.text();


    const rows =
      parseCSV(text);


    if (!rows.length) {

      throw new Error(
        "ไม่พบข้อมูล"
      );

    }


    const headers =
      rows[0].map(
        header =>
          String(header).trim()
      );


    allData =
      rows
        .slice(1)
        .map(
          row => {

            const obj = {};


            headers.forEach(
              (
                header,
                index
              ) => {

                obj[header] =
                  row[index] ?? "";

              }
            );


            return obj;

          }
        )
        .filter(
          row =>
            Object.values(row)
              .some(
                value =>
                  String(value).trim() !== ""
              )
        );


    status.className =
      "status";


    status.textContent =
      `โหลดข้อมูลสำเร็จ ${allData.length.toLocaleString()} รายการ`;


    console.log(
      "Loaded rows:",
      allData.length
    );


    setupAutocomplete(
      regionInput,
      regionSuggestions,
      "region"
    );


    setupAutocomplete(
      districtInput,
      districtSuggestions,
      "district_th"
    );


    setupAutocomplete(
      subdistrictInput,
      subdistrictSuggestions,
      "subdistrict_th"
    );


  }
  catch (error) {


    console.error(error);


    status.className =
      "status error";


    status.textContent =
      "เกิดข้อผิดพลาดในการโหลดข้อมูล: " +
      error.message;


    resultArea.innerHTML =
      `<div class="empty">

        ❌ ไม่สามารถโหลดข้อมูลได้

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>`;

  }

}



/* =========================================================
   GET CONTEXT DATA
   ========================================================= */

function getContextData(
  fieldName
) {


  let data =
    allData;


  /*
    REGION
  */

  if (
    fieldName === "region"
  ) {

    return data;

  }


  /*
    CURRENT REGION
  */

  const regionKeyword =
    normalize(
      regionInput.value
    );


  /*
    CURRENT DISTRICT
  */

  const districtKeyword =
    normalize(
      districtInput.value
    );


  /*
    DISTRICT
  */

  if (
    fieldName === "district_th"
  ) {


    if (regionKeyword) {

      data =
        data.filter(
          row =>
            normalize(
              row.region
            ).includes(
              regionKeyword
            )
        );

    }


    return data;

  }


  /*
    SUBDISTRICT
  */

  if (
    fieldName === "subdistrict_th"
  ) {


    if (regionKeyword) {

      data =
        data.filter(
          row =>
            normalize(
              row.region
            ).includes(
              regionKeyword
            )
        );

    }


    if (districtKeyword) {

      data =
        data.filter(
          row =>
            normalize(
              row.district_th
            ).includes(
              districtKeyword
            )
        );

    }


    return data;

  }


  return data;

}



/* =========================================================
   AUTOCOMPLETE
   ========================================================= */

function setupAutocomplete(
  input,
  suggestionBox,
  fieldName
) {


  input.addEventListener(
    "input",
    function() {

      showSuggestions(
        input,
        suggestionBox,
        fieldName
      );

    }
  );


  input.addEventListener(
    "focus",
    function() {

      showSuggestions(
        input,
        suggestionBox,
        fieldName
      );

    }
  );


  input.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Escape"
      ) {

        hideAllSuggestions();

      }

    }
  );

}



/* =========================================================
   SHOW SUGGESTIONS
   ========================================================= */

function showSuggestions(
  input,
  suggestionBox,
  fieldName
) {


  suggestionBox.innerHTML = "";


  if (!allData.length) {

    suggestionBox.style.display =
      "none";

    return;

  }


  const keyword =
    normalize(
      input.value
    );


  const contextData =
    getContextData(
      fieldName
    );


  const values =
    uniqueSorted(
      contextData.map(
        row =>
          row[fieldName]
      )
    );


  let matches;


  if (keyword) {

    matches =
      values
        .filter(
          value =>
            normalize(value)
              .includes(
                keyword
              )
        )
        .slice(
          0,
          50
        );

  }
  else {

    matches =
      values.slice(
        0,
        50
      );

  }


  if (!matches.length) {

    suggestionBox.innerHTML =
      `<div class="suggestion-empty">
        ไม่พบข้อมูล
      </div>`;


    suggestionBox.style.display =
      "block";


    return;

  }


  matches.forEach(
    value => {


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "suggestion-item";


      item.innerHTML =
        highlightMatch(
          value,
          keyword
        );


      item.addEventListener(
        "mousedown",
        function(event) {

          event.preventDefault();


          input.value =
            value;


          hideAllSuggestions();


          /*
            ถ้าเลือก Region
            ล้าง District + Subdistrict
          */

          if (
            fieldName === "region"
          ) {

            districtInput.value =
              "";

            subdistrictInput.value =
              "";

          }


          /*
            ถ้าเลือก District
            ล้าง Subdistrict
          */

          if (
            fieldName === "district_th"
          ) {

            subdistrictInput.value =
              "";

          }

        }
      );


      suggestionBox.appendChild(
        item
      );

    }
  );


  suggestionBox.style.display =
    "block";

}



/* =========================================================
   HIGHLIGHT MATCH
   ========================================================= */

function highlightMatch(
  text,
  keyword
) {


  if (!keyword) {

    return escapeHtml(
      text
    );

  }


  const lowerText =
    normalize(text);


  const lowerKeyword =
    normalize(keyword);


  const index =
    lowerText.indexOf(
      lowerKeyword
    );


  if (index === -1) {

    return escapeHtml(
      text
    );

  }


  const before =
    text.substring(
      0,
      index
    );


  const match =
    text.substring(
      index,
      index + keyword.length
    );


  const after =
    text.substring(
      index + keyword.length
    );


  return (
    escapeHtml(before) +
    "<strong>" +
    escapeHtml(match) +
    "</strong>" +
    escapeHtml(after)
  );

}



/* =========================================================
   HIDE SUGGESTIONS
   ========================================================= */

function hideAllSuggestions() {

  regionSuggestions.style.display =
    "none";


  districtSuggestions.style.display =
    "none";


  subdistrictSuggestions.style.display =
    "none";

}



/* =========================================================
   CLICK OUTSIDE
   ========================================================= */

document.addEventListener(
  "click",
  function(event) {

    if (
      !event.target.closest(
        ".field"
      )
    ) {

      hideAllSuggestions();

    }

  }
);



/* =========================================================
   SEARCH
   ========================================================= */

function searchData() {


  hideAllSuggestions();


  const region =
    normalize(
      regionInput.value
    );


  const district =
    normalize(
      districtInput.value
    );


  const subdistrict =
    normalize(
      subdistrictInput.value
    );


  /*
    ไม่มีคำค้น
  */

  if (
    !region &&
    !district &&
    !subdistrict
  ) {


    resultCount.textContent =
      "0";


    resultArea.innerHTML =
      `<div class="empty">

        ⚠️ กรุณากรอกข้อมูลอย่างน้อย 1 ช่อง

      </div>`;


    return;

  }


  /*
    SEARCH แบบ AND
  */

  const filtered =
    allData.filter(
      row => {


        const rowRegion =
          normalize(
            row.region
          );


        const rowDistrict =
          normalize(
            row.district_th
          );


        const rowSubdistrict =
          normalize(
            row.subdistrict_th
          );


        if (
          region &&
          !rowRegion.includes(
            region
          )
        ) {

          return false;

        }


        if (
          district &&
          !rowDistrict.includes(
            district
          )
        ) {

          return false;

        }


        if (
          subdistrict &&
          !rowSubdistrict.includes(
            subdistrict
          )
        ) {

          return false;

        }


        return true;

      }
    );


  renderResults(
    filtered
  );

}



/* =========================================================
   RENDER RESULTS
   ========================================================= */

function renderResults(
  data
) {


  /*
    GROUP BY TEAM
  */

  const groups =
    new Map();


  data.forEach(
    row => {


      const team =
        String(
          row.team_name || "-"
        ).trim();


      if (
        !groups.has(team)
      ) {

        groups.set(
          team,
          []
        );

      }


      groups
        .get(team)
        .push(row);

    }
  );


  /*
    นับจำนวน TEAM
  */

  resultCount.textContent =
    groups.size.toLocaleString();


  /*
    ไม่มีข้อมูล
  */

  if (
    groups.size === 0
  ) {


    resultArea.innerHTML =
      `<div class="empty">

        🔎 ไม่พบข้อมูล

        <br><br>

        ลองเปลี่ยนคำค้นหา

      </div>`;


    return;

  }


  /*
    สร้างผลลัพธ์
  */

  resultArea.innerHTML =
    "";


  let index = 1;


  groups.forEach(
    (
      rows,
      team
    ) => {


      const firstRow =
        rows[0];


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "team-card";


      card.innerHTML = `

        <div class="team-name">

          ${index}.
          ${escapeHtml(
            team
          )}

        </div>


        <div class="team-info">

          <span class="tag">

            🌎
            ${escapeHtml(
              firstRow.region || "-"
            )}

          </span>


          <span class="tag">

            📍
            ${escapeHtml(
              firstRow.district_th || "-"
            )}

          </span>


          <span class="tag">

            📍
            ${escapeHtml(
              firstRow.subdistrict_th || "-"
            )}

          </span>


          <span class="tag">

            🇬🇧
            ${escapeHtml(
              firstRow.province_en || "-"
            )}

          </span>


          <span class="tag">

            ${escapeHtml(
              firstRow.subdistrict_en || "-"
            )}

          </span>

        </div>

      `;


      resultArea.appendChild(
        card
      );


      index++;

    }
  );

}



/* =========================================================
   SEARCH BUTTON
   ========================================================= */

searchBtn.addEventListener(
  "click",
  searchData
);



/* =========================================================
   ENTER = SEARCH
   ========================================================= */

[
  regionInput,
  districtInput,
  subdistrictInput
].forEach(
  input => {


    input.addEventListener(
      "keydown",
      function(event) {


        if (
          event.key === "Enter"
        ) {

          searchData();

        }

      }
    );

  }
);



/* =========================================================
   CLEAR
   ========================================================= */

clearBtn.addEventListener(
  "click",
  function() {


    regionInput.value =
      "";

    districtInput.value =
      "";

    subdistrictInput.value =
      "";


    hideAllSuggestions();


    resultCount.textContent =
      "0";


    resultArea.innerHTML =
      `<div class="empty">

        กรุณาใส่ข้อมูลอย่างน้อย 1 ช่อง
        แล้วกด "ค้นหา"

      </div>`;

  }
);



/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
  value
) {


  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =========================================================
   START
   ========================================================= */

loadData();


</script>

</body>

</html>
