<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Area ROM Search</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px 40px;
    }

    .header {
      background: white;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #666;
      font-size: 15px;
    }

    .search-box {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    .search-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .field {
      position: relative;
    }

    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      font-size: 14px;
    }

    .field input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .field input:focus {
      border-color: #1976d2;
      box-shadow: 0 0 0 3px rgba(25,118,210,.1);
    }

    .suggestions {
      position: absolute;
      top: 76px;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      max-height: 230px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 5px 15px rgba(0,0,0,.12);
      display: none;
    }

    .suggestion-item {
      padding: 10px 12px;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 1px solid #eee;
    }

    .suggestion-item:hover {
      background: #f1f5f9;
    }

    .suggestion-item mark {
      background: #fff3a3;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 20px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-search {
      background: #1976d2;
      color: white;
    }

    .btn-search:hover {
      background: #1565c0;
    }

    .btn-clear {
      background: #e5e7eb;
      color: #333;
    }

    .status {
      background: white;
      border-radius: 14px;
      padding: 15px 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      font-size: 15px;
    }

    .status.loading {
      color: #1976d2;
    }

    .status.success {
      color: #15803d;
    }

    .status.error {
      color: #dc2626;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .results-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .result-count {
      color: #666;
      font-size: 14px;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .result-card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
      border-left: 5px solid #1976d2;
    }

    .result-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 14px;
      color: #1976d2;
      word-break: break-word;
    }

    .result-row {
      display: flex;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .result-label {
      width: 120px;
      min-width: 120px;
      color: #666;
      font-weight: bold;
    }

    .result-value {
      word-break: break-word;
    }

    .no-results {
      background: white;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      color: #777;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 13px;
      margin-top: 30px;
    }

    @media (max-width: 800px) {

      .search-grid {
        grid-template-columns: 1fr;
      }

      .results {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 23px;
      }

    }

    @media (max-width: 500px) {

      .container {
        padding: 15px 10px 30px;
      }

      .header,
      .search-box {
        padding: 15px;
      }

      .button-row {
        flex-direction: column;
      }

      .button-row button {
        width: 100%;
      }

      .result-row {
        display: block;
      }

      .result-label {
        width: auto;
        min-width: auto;
        margin-bottom: 2px;
      }

    }

  </style>

</head>


<body>

<div class="container">

  <div class="header">

    <h1>Area ROM Search</h1>

    <p>
      ค้นหาข้อมูลพื้นที่ ROM จาก Region, District และ Subdistrict
    </p>

  </div>


  <div class="search-box">

    <div class="search-grid">

      <!-- REGION -->
      <div class="field">

        <label for="region">
          Region
        </label>

        <input
          type="text"
          id="region"
          placeholder="ค้นหา Region..."
          autocomplete="off"
        >

        <div
          id="regionSuggestions"
          class="suggestions">
        </div>

      </div>


      <!-- DISTRICT -->
      <div class="field">

        <label for="district">
          District
        </label>

        <input
          type="text"
          id="district"
          placeholder="ค้นหา District..."
          autocomplete="off"
        >

        <div
          id="districtSuggestions"
          class="suggestions">
        </div>

      </div>


      <!-- SUBDISTRICT -->
      <div class="field">

        <label for="subdistrict">
          Subdistrict
        </label>

        <input
          type="text"
          id="subdistrict"
          placeholder="ค้นหา Subdistrict..."
          autocomplete="off"
        >

        <div
          id="subdistrictSuggestions"
          class="suggestions">
        </div>

      </div>

    </div>


    <div class="button-row">

      <button
        class="btn-search"
        onclick="searchData()">
        🔍 ค้นหา
      </button>

      <button
        class="btn-clear"
        onclick="clearSearch()">
        ✕ ล้างข้อมูล
      </button>

    </div>

  </div>


  <div
    id="status"
    class="status loading">

    ⏳ กำลังโหลดข้อมูล...

  </div>


  <div class="results-header">

    <h2>
      ผลการค้นหา
    </h2>

    <div
      id="resultCount"
      class="result-count">
      0 รายการ
    </div>

  </div>


  <div
    id="results"
    class="results">
  </div>


  <div class="footer">

    Area ROM Search

  </div>

</div>


<script>

  /*
   * ======================================================
   * API
   * ======================================================
   *
   * สำคัญ:
   * Browser จะเรียก Netlify Function
   * ไม่ได้เรียก Google Apps Script โดยตรง
   */

  const API_URL = "/.netlify/functions/getData";


  let allData = [];


  /*
   * ======================================================
   * GET FIELD
   * ======================================================
   */

  function getField(row, fieldName) {

    if (!row) {
      return "";
    }

    if (
      row[fieldName] === undefined ||
      row[fieldName] === null
    ) {
      return "";
    }

    return String(
      row[fieldName]
    ).trim();

  }


  /*
   * ======================================================
   * NORMALIZE
   * ======================================================
   */

  function normalizeValue(value) {

    return String(value || "")
      .trim()
      .toLowerCase();

  }


  /*
   * ======================================================
   * ESCAPE HTML
   * ======================================================
 */

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   * ======================================================
   * HIGHLIGHT
   * ======================================================
   */

  function highlightMatch(text, search) {

    const safeText =
      escapeHtml(text);

    if (!search) {
      return safeText;
    }

    const escapedSearch =
      String(search)
        .replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

    const regex =
      new RegExp(
        "(" + escapedSearch + ")",
        "gi"
      );

    return safeText.replace(
      regex,
      "<mark>$1</mark>"
    );

  }


  /*
   * ======================================================
   * LOAD DATA
   * ======================================================
   */

  async function loadData() {

    const status =
      document.getElementById("status");

    try {

      status.className =
        "status loading";

      status.textContent =
        "⏳ กำลังโหลดข้อมูลจาก Google Sheets...";


      const response =
        await fetch(API_URL, {
          method: "GET"
        });


      if (!response.ok) {

        throw new Error(
          "HTTP " + response.status
        );

      }


      const data =
        await response.json();


      if (!Array.isArray(data)) {

        throw new Error(
          "รูปแบบข้อมูลไม่ถูกต้อง"
        );

      }


      allData = data;


      status.className =
        "status success";

      status.textContent =
        "✅ โหลดข้อมูลสำเร็จ " +
        allData.length.toLocaleString() +
        " รายการ";


      displayResults(
        allData
      );


    } catch (error) {

      console.error(
        "Load data error:",
        error
      );


      status.className =
        "status error";

      status.textContent =
        "❌ ไม่สามารถโหลดข้อมูลได้: " +
        error.message;


      document.getElementById(
        "results"
      ).innerHTML = `

        <div class="no-results">

          ❌ ไม่สามารถโหลดข้อมูลจาก Google Sheets ได้

          <br><br>

          กรุณาตรวจสอบ Netlify Function

        </div>

      `;


      document.getElementById(
        "resultCount"
      ).textContent =
        "0 รายการ";

    }

  }


  /*
   * ======================================================
   * CONTEXT FILTER
   * ======================================================
   */

  function getContextFilteredData(
    excludeField
  ) {

    const region =
      normalizeValue(
        document.getElementById(
          "region"
        ).value
      );

    const district =
      normalizeValue(
        document.getElementById(
          "district"
        ).value
      );

    const subdistrict =
      normalizeValue(
        document.getElementById(
          "subdistrict"
        ).value
      );


    return allData.filter(row => {

      const rowRegion =
        normalizeValue(
          getField(
            row,
            "region"
          )
        );

      const rowDistrict =
        normalizeValue(
          getField(
            row,
            "district_th"
          )
        );

      const rowSubdistrict =
        normalizeValue(
          getField(
            row,
            "subdistrict_th"
          )
        );


      if (
        excludeField !== "region" &&
        region &&
        rowRegion !== region
      ) {
        return false;
      }


      if (
        excludeField !== "district" &&
        district &&
        rowDistrict !== district
      ) {
        return false;
      }


      if (
        excludeField !== "subdistrict" &&
        subdistrict &&
        rowSubdistrict !== subdistrict
      ) {
        return false;
      }


      return true;

    });

  }


  /*
   * ======================================================
   * SHOW SUGGESTIONS
   * ======================================================
   */

  function showSuggestions(
    field,
    suggestionBox
  ) {

    const input =
      document.getElementById(
        field
      );

    const search =
      normalizeValue(
        input.value
      );


    const filtered =
      getContextFilteredData(
        field
      );


    let values = [];


    if (field === "region") {

      values =
        filtered.map(row =>
          getField(
            row,
            "region"
          )
        );

    }


    else if (field === "district") {

      values =
        filtered.map(row =>
          getField(
            row,
            "district_th"
          )
        );

    }


    else if (field === "subdistrict") {

      values =
        filtered.map(row =>
          getField(
            row,
            "subdistrict_th"
          )
        );

    }


    values =
      [
        ...new Set(
          values.filter(
            value => value
          )
        )
      ];


    if (search) {

      values =
        values.filter(
          value =>
            normalizeValue(value)
              .includes(search)
        );

    }


    values.sort(
      (a, b) =>
        a.localeCompare(
          b,
          "th"
        )
    );


    values =
      values.slice(
        0,
        50
      );


    if (!values.length) {

      suggestionBox.style.display =
        "none";

      suggestionBox.innerHTML =
        "";

      return;

    }


    suggestionBox.innerHTML =
      values.map(value => {

        return `

          <div
            class="suggestion-item"
            data-value="${escapeHtml(value)}">

            ${highlightMatch(
              value,
              input.value
            )}

          </div>

        `;

      }).join("");


    suggestionBox
      .querySelectorAll(
        ".suggestion-item"
      )
      .forEach(item => {

        item.addEventListener(
          "click",
          function() {

            input.value =
              this.dataset.value;

            suggestionBox.style.display =
              "none";

            refreshAllSuggestions();

          }
        );

      });


    suggestionBox.style.display =
      "block";

  }


  /*
   * ======================================================
   * REFRESH
   * ======================================================
   */

  function refreshAllSuggestions() {

    const active =
      document.activeElement;


    if (
      active &&
      active.id === "region"
    ) {

      showSuggestions(
        "region",
        document.getElementById(
          "regionSuggestions"
        )
      );

    }


    if (
      active &&
      active.id === "district"
    ) {

      showSuggestions(
        "district",
        document.getElementById(
          "districtSuggestions"
        )
      );

    }


    if (
      active &&
      active.id === "subdistrict"
    ) {

      showSuggestions(
        "subdistrict",
        document.getElementById(
          "subdistrictSuggestions"
        )
      );

    }

  }


  /*
   * ======================================================
   * SEARCH
   * ======================================================
   */

  function searchData() {

    const region =
      normalizeValue(
        document.getElementById(
          "region"
        ).value
      );

    const district =
      normalizeValue(
        document.getElementById(
          "district"
        ).value
      );

    const subdistrict =
      normalizeValue(
        document.getElementById(
          "subdistrict"
        ).value
      );


    const filtered =
      allData.filter(row => {

        const rowRegion =
          normalizeValue(
            getField(
              row,
              "region"
            )
          );

        const rowDistrict =
          normalizeValue(
            getField(
              row,
              "district_th"
            )
          );

        const rowSubdistrict =
          normalizeValue(
            getField(
              row,
              "subdistrict_th"
            )
          );


        if (
          region &&
          !rowRegion.includes(
            region
          )
        ) {
          return false;
        }


        if (
          district &&
          !rowDistrict.includes(
            district
          )
        ) {
          return false;
        }


        if (
          subdistrict &&
          !rowSubdistrict.includes(
            subdistrict
          )
        ) {
          return false;
        }


        return true;

      });


    displayResults(
      filtered
    );

    hideAllSuggestions();

  }


  /*
   * ======================================================
   * DISPLAY RESULTS
   * ======================================================
   */

  function displayResults(
    data
  ) {

    const results =
      document.getElementById(
        "results"
      );

    const resultCount =
      document.getElementById(
        "resultCount"
      );


    const grouped =
      new Map();


    data.forEach(row => {

      const team =
        getField(
          row,
          "team_name"
        );


      const key =
        team ||
        (
          getField(row, "region") +
          "|" +
          getField(row, "district_th") +
          "|" +
          getField(row, "subdistrict_th")
        );


      if (!grouped.has(key)) {

        grouped.set(
          key,
          row
        );

      }

    });


    const uniqueResults =
      Array.from(
        grouped.values()
      );


    resultCount.textContent =
      uniqueResults.length.toLocaleString() +
      " รายการ";


    if (!uniqueResults.length) {

      results.innerHTML = `

        <div class="no-results">

          🔎 ไม่พบข้อมูลที่ค้นหา

        </div>

      `;

      return;

    }


    results.innerHTML =
      uniqueResults.map(row => {

        const team =
          getField(
            row,
            "team_name"
          );

        const region =
          getField(
            row,
            "region"
          );

        const district =
          getField(
            row,
            "district_th"
          );

        const subdistrict =
          getField(
            row,
            "subdistrict_th"
          );

        const provinceEn =
          getField(
            row,
            "province_en"
          );

        const subdistrictEn =
          getField(
            row,
            "subdistrict_en"
          );


        return `

          <div class="result-card">

            <div class="result-title">

              ${escapeHtml(
                team || "ไม่ระบุ Team"
              )}

            </div>


            <div class="result-row">

              <div class="result-label">
                Region
              </div>

              <div class="result-value">
                ${escapeHtml(region)}
              </div>

            </div>


            <div class="result-row">

              <div class="result-label">
                District
              </div>

              <div class="result-value">
                ${escapeHtml(district)}
              </div>

            </div>


            <div class="result-row">

              <div class="result-label">
                Subdistrict
              </div>

              <div class="result-value">
                ${escapeHtml(subdistrict)}
              </div>

            </div>


            <div class="result-row">

              <div class="result-label">
                Province EN
              </div>

              <div class="result-value">
                ${escapeHtml(provinceEn)}
              </div>

            </div>


            <div class="result-row">

              <div class="result-label">
                Subdistrict EN
              </div>

              <div class="result-value">
                ${escapeHtml(subdistrictEn)}
              </div>

            </div>

          </div>

        `;

      }).join("");

  }


  /*
   * ======================================================
   * CLEAR
   * ======================================================
   */

  function clearSearch() {

    document.getElementById(
      "region"
    ).value = "";

    document.getElementById(
      "district"
    ).value = "";

    document.getElementById(
      "subdistrict"
    ).value = "";


    hideAllSuggestions();


    displayResults(
      allData
    );

  }


  /*
   * ======================================================
   * HIDE SUGGESTIONS
   * ======================================================
   */

  function hideAllSuggestions() {

    document.querySelectorAll(
      ".suggestions"
    ).forEach(box => {

      box.style.display =
        "none";

    });

  }


  /*
   * ======================================================
   * INPUT
   * ======================================================
   */

  document
    .getElementById("region")
    .addEventListener(
      "input",
      function() {

        showSuggestions(
          "region",
          document.getElementById(
            "regionSuggestions"
          )
        );

      }
    );


  document
    .getElementById("district")
    .addEventListener(
      "input",
      function() {

        showSuggestions(
          "district",
          document.getElementById(
            "districtSuggestions"
          )
        );

      }
    );


  document
    .getElementById("subdistrict")
    .addEventListener(
      "input",
      function() {

        showSuggestions(
          "subdistrict",
          document.getElementById(
            "subdistrictSuggestions"
          )
        );

      }
    );


  /*
   * ======================================================
   * FOCUS
   * ======================================================
   */

  document
    .getElementById("region")
    .addEventListener(
      "focus",
      function() {

        showSuggestions(
          "region",
          document.getElementById(
            "regionSuggestions"
          )
        );

      }
    );


  document
    .getElementById("district")
    .addEventListener(
      "focus",
      function() {

        showSuggestions(
          "district",
          document.getElementById(
            "districtSuggestions"
          )
        );

      }
    );


  document
    .getElementById("subdistrict")
    .addEventListener(
      "focus",
      function() {

        showSuggestions(
          "subdistrict",
          document.getElementById(
            "subdistrictSuggestions"
          )
        );

      }
    );


  /*
   * ======================================================
   * ENTER
   * ======================================================
   */

  document
    .querySelectorAll(
      "#region, #district, #subdistrict"
    )
    .forEach(input => {

      input.addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            event.preventDefault();

            searchData();

          }

        }
      );

    });


  /*
   * ======================================================
   * CLICK OUTSIDE
   * ======================================================
   */

  document.addEventListener(
    "click",
    function(event) {

      if (
        !event.target.closest(
          ".field"
        )
      ) {

        hideAllSuggestions();

      }

    }
  );


  /*
   * ======================================================
   * START
   * ======================================================
   */

  loadData();

</script>

</body>

</html>
