<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Area ROM Search</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .header p {
      margin: 0;
      color: #666;
      font-size: 15px;
    }

    .search-box {
      background: #fff;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
      margin-bottom: 25px;
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .field {
      position: relative;
    }

    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      font-size: 14px;
    }

    .field input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    .field input:focus {
      border-color: #1976d2;
      box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.1);
    }

    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #ddd;
      border-top: none;
      border-radius: 0 0 8px 8px;
      max-height: 260px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .suggestion-item {
      padding: 10px 12px;
      cursor: pointer;
      font-size: 14px;
    }

    .suggestion-item:hover {
      background: #f1f5f9;
    }

    .suggestion-empty {
      padding: 10px 12px;
      color: #888;
      font-size: 13px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 22px;
      font-size: 15px;
      cursor: pointer;
    }

    #searchBtn {
      background: #1976d2;
      color: #fff;
    }

    #searchBtn:hover {
      background: #1565c0;
    }

    #clearBtn {
      background: #e0e0e0;
      color: #333;
    }

    #clearBtn:hover {
      background: #d0d0d0;
    }

    .hint {
      margin-top: 12px;
      color: #777;
      font-size: 13px;
    }

    .status {
      margin-bottom: 12px;
      color: #555;
      font-size: 14px;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .result-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .result-count {
      color: #666;
      font-size: 14px;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .team-card {
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 9px rgba(0, 0, 0, 0.07);
    }

    .team-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 13px;
      word-break: break-word;
    }

    .area-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .area-item {
      padding: 10px 12px;
      background: #f7f9fb;
      border-radius: 8px;
      border-left: 4px solid #1976d2;
    }

    .area-main {
      font-weight: bold;
      font-size: 14px;
      word-break: break-word;
    }

    .area-sub {
      margin-top: 4px;
      color: #666;
      font-size: 13px;
      word-break: break-word;
    }

    .empty {
      background: #fff;
      padding: 30px;
      text-align: center;
      color: #777;
      border-radius: 12px;
      box-shadow: 0 2px 9px rgba(0, 0, 0, 0.05);
    }

    @media (max-width: 800px) {

      .fields {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 20px 12px 40px;
      }

      .header h1 {
        font-size: 26px;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

    }

  </style>

</head>


<body>

  <div class="container">

    <div class="header">

      <h1>Area ROM Search</h1>

      <p>
        ค้นหาข้อมูลพื้นที่และทีม ROM จาก Google Sheets
      </p>

    </div>


    <div class="search-box">

      <div class="fields">

        <!-- Region -->
        <div class="field">

          <label for="regionInput">
            Region
          </label>

          <input
            type="text"
            id="regionInput"
            autocomplete="off"
            placeholder="เช่น BKK"
          >

          <div
            id="regionSuggestions"
            class="suggestions"
          ></div>

        </div>


        <!-- District -->
        <div class="field">

          <label for="districtInput">
            District
          </label>

          <input
            type="text"
            id="districtInput"
            autocomplete="off"
            placeholder="เช่น ห้วยขวาง"
          >

          <div
            id="districtSuggestions"
            class="suggestions"
          ></div>

        </div>


        <!-- Subdistrict -->
        <div class="field">

          <label for="subdistrictInput">
            Subdistrict
          </label>

          <input
            type="text"
            id="subdistrictInput"
            autocomplete="off"
            placeholder="เช่น ห้วยขวาง"
          >

          <div
            id="subdistrictSuggestions"
            class="suggestions"
          ></div>

        </div>

      </div>


      <div class="buttons">

        <button id="searchBtn">
          🔍 ค้นหา
        </button>

        <button id="clearBtn">
          ✕ ล้างข้อมูล
        </button>

      </div>


      <div class="hint">
        💡 กรอกช่องใดช่องหนึ่งก็ได้
        หรือกรอกหลายช่องเพื่อค้นหาแบบ AND
      </div>

    </div>


    <div id="status" class="status"></div>


    <div class="result-header">

      <h2>
        ผลการค้นหา
      </h2>

      <div
        id="resultCount"
        class="result-count"
      >
        -
      </div>

    </div>


    <div
      id="results"
      class="results"
    >

      <div class="empty">
        กรุณากรอกข้อมูลแล้วกดค้นหา
      </div>

    </div>

  </div>


  <script>

    // ============================================
    // Google Sheets CSV
    // ============================================

    const CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vTqZ-wlrqIB2aB4GoLiiUNk946EGiHCo0JZxPnDw08KMofmBs9g8z1L6JD2OYTEFaipCKR_AngY6Qv_/pub?output=csv";


    // ============================================
    // DOM
    // ============================================

    const regionInput =
      document.getElementById("regionInput");

    const districtInput =
      document.getElementById("districtInput");

    const subdistrictInput =
      document.getElementById("subdistrictInput");


    const regionSuggestions =
      document.getElementById("regionSuggestions");

    const districtSuggestions =
      document.getElementById("districtSuggestions");

    const subdistrictSuggestions =
      document.getElementById("subdistrictSuggestions");


    const searchBtn =
      document.getElementById("searchBtn");

    const clearBtn =
      document.getElementById("clearBtn");


    const status =
      document.getElementById("status");

    const resultCount =
      document.getElementById("resultCount");

    const results =
      document.getElementById("results");


    let allData = [];


    // ============================================
    // Normalize
    // ============================================

    function normalize(value) {

      return String(value ?? "")
        .trim()
        .toLowerCase();

    }


    // ============================================
    // CSV Parser
    // ============================================

    function parseCSV(text) {

      const rows = [];

      let row = [];

      let cell = "";

      let insideQuotes = false;


      for (let i = 0; i < text.length; i++) {

        const char = text[i];

        const next = text[i + 1];


        if (char === '"') {

          if (insideQuotes && next === '"') {

            cell += '"';

            i++;

          } else {

            insideQuotes = !insideQuotes;

          }

        }

        else if (char === "," && !insideQuotes) {

          row.push(cell);

          cell = "";

        }

        else if (
          (char === "\n" || char === "\r")
          && !insideQuotes
        ) {

          if (char === "\r" && next === "\n") {
            i++;
          }

          row.push(cell);

          cell = "";

          if (
            row.length > 1 ||
            row.some(value => value.trim() !== "")
          ) {

            rows.push(row);

          }

          row = [];

        }

        else {

          cell += char;

        }

      }


      row.push(cell);

      if (
        row.length > 1 ||
        row.some(value => value.trim() !== "")
      ) {

        rows.push(row);

      }


      if (!rows.length) {
        return [];
      }


      const headers =
        rows[0].map(header => header.trim());


      return rows
        .slice(1)
        .map(row => {

          const obj = {};

          headers.forEach((header, index) => {

            obj[header] =
              row[index] !== undefined
                ? row[index].trim()
                : "";

          });

          return obj;

        })
        .filter(row =>
          Object.values(row).some(
            value => String(value).trim() !== ""
          )
        );

    }


    // ============================================
    // Load Data
    // ============================================

    async function loadData() {

      try {

        status.textContent =
          "กำลังโหลดข้อมูล...";


        const response =
          await fetch(
            CSV_URL +
            "&t=" +
            Date.now()
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " + response.status
          );

        }


        const text =
          await response.text();


        allData =
          parseCSV(text);


        status.textContent =
          `โหลดข้อมูลแล้ว ${allData.length.toLocaleString()} รายการ`;


        setupAutocomplete();


      } catch (error) {

        console.error(error);

        status.textContent =
          "ไม่สามารถโหลดข้อมูลได้";


        results.innerHTML = `
          <div class="empty">
            ไม่สามารถโหลดข้อมูลจาก Google Sheets ได้
          </div>
        `;

      }

    }


    // ============================================
    // Get Context Data
    // ============================================

    function getContextData(fieldName) {

      let data = [...allData];


      const regionKeyword =
        normalize(regionInput.value);

      const districtKeyword =
        normalize(districtInput.value);


      if (
        fieldName === "district" ||
        fieldName === "subdistrict"
      ) {

        if (regionKeyword) {

          data =
            data.filter(row =>
              normalize(row.region)
                .includes(regionKeyword)
            );

        }

      }


      if (
        fieldName === "subdistrict"
      ) {

        if (districtKeyword) {

          data =
            data.filter(row =>
              normalize(row.district_th)
                .includes(districtKeyword)
            );

        }

      }


      return data;

    }


    // ============================================
    // Show Suggestions
    // ============================================

    function showSuggestions(
      input,
      suggestionBox,
      fieldName,
      valueKey
    ) {

      const keyword =
        normalize(input.value);


      const contextData =
        getContextData(fieldName);


      const values = [
        ...new Set(
          contextData
            .map(row => row[valueKey])
            .filter(value =>
              String(value ?? "").trim() !== ""
            )
        )
      ];


      const filtered =
        values
          .filter(value =>
            normalize(value)
              .includes(keyword)
          )
          .sort((a, b) =>
            String(a).localeCompare(
              String(b),
              "th"
            )
          )
          .slice(0, 15);


      suggestionBox.innerHTML = "";


      if (!filtered.length) {

        suggestionBox.innerHTML = `
          <div class="suggestion-empty">
            ไม่พบข้อมูลในเงื่อนไขปัจจุบัน
          </div>
        `;

        suggestionBox.style.display =
          "block";

        return;

      }


      filtered.forEach(value => {

        const item =
          document.createElement("div");


        item.className =
          "suggestion-item";


        item.textContent =
          value;


        item.addEventListener(
          "mousedown",
          function (event) {

            event.preventDefault();

            input.value = value;

            suggestionBox.style.display =
              "none";

          }
        );


        suggestionBox.appendChild(item);

      });


      suggestionBox.style.display =
        "block";

    }


    // ============================================
    // Hide Suggestions
    // ============================================

    function hideAllSuggestions() {

      regionSuggestions.style.display =
        "none";

      districtSuggestions.style.display =
        "none";

      subdistrictSuggestions.style.display =
        "none";

    }


    // ============================================
    // Autocomplete
    // ============================================

    function setupAutocomplete() {

      regionInput.addEventListener(
        "input",
        function () {

          showSuggestions(
            regionInput,
            regionSuggestions,
            "region",
            "region"
          );

        }
      );


      districtInput.addEventListener(
        "input",
        function () {

          showSuggestions(
            districtInput,
            districtSuggestions,
            "district",
            "district_th"
          );

        }
      );


      subdistrictInput.addEventListener(
        "input",
        function () {

          showSuggestions(
            subdistrictInput,
            subdistrictSuggestions,
            "subdistrict",
            "subdistrict_th"
          );

        }
      );


      regionInput.addEventListener(
        "focus",
        function () {

          showSuggestions(
            regionInput,
            regionSuggestions,
            "region",
            "region"
          );

        }
      );


      districtInput.addEventListener(
        "focus",
        function () {

          showSuggestions(
            districtInput,
            districtSuggestions,
            "district",
            "district_th"
          );

        }
      );


      subdistrictInput.addEventListener(
        "focus",
        function () {

          showSuggestions(
            subdistrictInput,
            subdistrictSuggestions,
            "subdistrict",
            "subdistrict_th"
          );

        }
      );

    }


    // ============================================
    // Search
    // ============================================

    function searchData() {

      const region =
        normalize(regionInput.value);

      const district =
        normalize(districtInput.value);

      const subdistrict =
        normalize(subdistrictInput.value);


      if (
        !region &&
        !district &&
        !subdistrict
      ) {

        resultCount.textContent = "-";


        results.innerHTML = `
          <div class="empty">
            กรุณากรอกอย่างน้อย 1 ช่อง
            แล้วกดค้นหา
          </div>
        `;

        return;

      }


      const filtered =
        allData.filter(row => {

          const matchRegion =
            !region ||
            normalize(row.region)
              .includes(region);


          const matchDistrict =
            !district ||
            normalize(row.district_th)
              .includes(district);


          const matchSubdistrict =
            !subdistrict ||
            normalize(row.subdistrict_th)
              .includes(subdistrict);


          return (
            matchRegion &&
            matchDistrict &&
            matchSubdistrict
          );

        });


      renderResults(filtered);

    }


    // ============================================
    // Render Results
    // ============================================

    function renderResults(data) {

      resultCount.textContent =
        `${data.length.toLocaleString()} รายการ`;


      if (!data.length) {

        results.innerHTML = `
          <div class="empty">
            ไม่พบข้อมูล
          </div>
        `;

        return;

      }


      const grouped =
        new Map();


      data.forEach(row => {

        const teamName =
          row.team_name ||
          "ไม่ระบุทีม";


        if (!grouped.has(teamName)) {

          grouped.set(
            teamName,
            []
          );

        }


        grouped
          .get(teamName)
          .push(row);

      });


      results.innerHTML = "";


      grouped.forEach(
        (rows, teamName) => {

          const card =
            document.createElement("div");


          card.className =
            "team-card";


          const title =
            document.createElement("div");


          title.className =
            "team-title";


          title.textContent =
            teamName;


          card.appendChild(title);


          const areaList =
            document.createElement("div");


          areaList.className =
            "area-list";


          rows.forEach(row => {

            const areaItem =
              document.createElement("div");


            areaItem.className =
              "area-item";


            const district =
              row.district_th ||
              "-";


            const subdistrict =
              row.subdistrict_th ||
              "-";


            const region =
              row.region ||
              "-";


            const province =
              row.province_en ||
              "-";


            const subdistrictEn =
              row.subdistrict_en ||
              "-";


            areaItem.innerHTML = `

              <div class="area-main">
                ${district} → ${subdistrict}
              </div>

              <div class="area-sub">
                Region: ${region}
                | Province: ${province}
                | ${subdistrictEn}
              </div>

            `;


            areaList.appendChild(
              areaItem
            );

          });


          card.appendChild(areaList);


          results.appendChild(card);

        }
      );

    }


    // ============================================
    // Search Button
    // ============================================

    searchBtn.addEventListener(
      "click",
      function () {

        hideAllSuggestions();

        searchData();

      }
    );


    // ============================================
    // Enter Key
    // ============================================

    [
      regionInput,
      districtInput,
      subdistrictInput
    ].forEach(input => {

      input.addEventListener(
        "keydown",
        function (event) {

          if (event.key === "Enter") {

            event.preventDefault();

            hideAllSuggestions();

            searchData();

          }

        }
      );

    });


    // ============================================
    // Clear Button
    // ============================================

    clearBtn.addEventListener(
      "click",
      function () {

        regionInput.value = "";

        districtInput.value = "";

        subdistrictInput.value = "";


        hideAllSuggestions();


        resultCount.textContent =
          "-";


        results.innerHTML = `
          <div class="empty">
            กรุณากรอกข้อมูลแล้วกดค้นหา
          </div>
        `;

      }
    );


    // ============================================
    // Click Outside
    // ============================================

    document.addEventListener(
      "click",
      function (event) {

        if (
          !event.target.closest(".field")
        ) {

          hideAllSuggestions();

        }

      }
    );


    // ============================================
    // Escape Key
    // ============================================

    document.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Escape") {

          hideAllSuggestions();

        }

      }
    );


    // ============================================
    // Start
    // ============================================

    loadData();

  </script>

</body>

</html>
