
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Area ROM Search</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f5f7fb;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --green: #15803d;
      --red: #b91c1c;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, "Noto Sans Thai", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.04);
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 18px;
    }

    .address-search {
      margin-bottom: 20px;
    }

    .address-search label,
    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .address-search input,
    .field input,
    .field select {
      width: 100%;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font: inherit;
      outline: none;
    }

    .address-search input:focus,
    .field input:focus,
    .field select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .help-text {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .status {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .result-count {
      font-size: 18px;
      font-weight: 700;
    }

    .status-message {
      margin: 0 0 18px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #eff6ff;
      color: #1d4ed8;
      line-height: 1.6;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .status-message.error {
      background: #fef2f2;
      color: var(--red);
    }

    .status-message.success {
      background: #f0fdf4;
      color: var(--green);
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .team-card {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      min-width: 0;
    }

    .team-title {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .team-title h3 {
      margin: 0;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .region-tag {
      flex-shrink: 0;
      padding: 4px 9px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
    }

    .area-list {
      margin: 0;
      padding-left: 20px;
      color: #475569;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .empty-state {
      padding: 34px 18px;
      border: 1px dashed #cbd5e1;
      border-radius: 14px;
      text-align: center;
      color: var(--muted);
      line-height: 1.8;
      background: #fff;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #cbd5e1;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 760px) {
      body {
        padding: 14px;
      }

      .header h1 {
        font-size: 23px;
      }

      .panel {
        padding: 16px;
      }

      .filter-grid,
      .results-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      <h1>Area ROM Search</h1>
      <p>ค้นหาพื้นที่และทีมจากฐานข้อมูล ROM</p>
    </header>

    <section class="panel">
      <h2>ค้นหาพื้นที่</h2>

      <div class="address-search">
        <label for="addressInput">ค้นหาจากที่อยู่เต็ม</label>
        <input
          id="addressInput"
          type="text"
          placeholder="เช่น 117/4 หมู่6 โคกคราม บางปลาม้า สุพรรณบุรี 72150"
          autocomplete="off"
        >
        <div class="help-text">
          วางที่อยู่ได้ทั้งแบบมีคำว่า แขวง/เขต/จังหวัด และแบบไม่มีคำกำกับ
          ระบบจะพยายามเทียบชื่อพื้นที่กับข้อมูลในฐานข้อมูล
        </div>
      </div>

      <div class="filter-grid">
        <div class="field">
          <label for="regionFilter">Region</label>
          <select id="regionFilter">
            <option value="">ทุก Region</option>
          </select>
        </div>

        <div class="field">
          <label for="districtFilter">District</label>
          <input
            id="districtFilter"
            type="text"
            placeholder="ค้นหาอำเภอหรือเขต"
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label for="subdistrictFilter">Subdistrict</label>
          <input
            id="subdistrictFilter"
            type="text"
            placeholder="ค้นหาตำบลหรือแขวง"
            autocomplete="off"
          >
        </div>
      </div>

      <div class="actions">
        <button id="searchButton" class="btn-primary" type="button">
          ค้นหา
        </button>
        <button id="clearButton" class="btn-secondary" type="button">
          ล้างข้อมูล
        </button>
      </div>
    </section>

    <section class="panel">
      <div class="status">
        <div class="result-count" id="resultCount">กำลังโหลดข้อมูล...</div>
        <div id="loadingIndicator" class="loading">
          <span class="spinner"></span>
          <span>กำลังโหลดข้อมูล</span>
        </div>
      </div>

      <div id="statusMessage" class="status-message">
        กำลังเชื่อมต่อฐานข้อมูล...
      </div>

      <div id="results" class="results-grid"></div>
    </section>
  </main>

  <script>
    /*
     * สำคัญ:
     * นำ URL ของ Google Apps Script Web App เดิมของคุณ
     * ที่ลงท้ายด้วย /exec มาใส่ในตัวแปรด้านล่าง
     */
    const API_URL = "ใส่_URL_Google_Apps_Script_เดิมของคุณ";

    let allData = [];
    let filteredData = [];

    const addressInput = document.getElementById("addressInput");
    const regionFilter = document.getElementById("regionFilter");
    const districtFilter = document.getElementById("districtFilter");
    const subdistrictFilter = document.getElementById("subdistrictFilter");
    const searchButton = document.getElementById("searchButton");
    const clearButton = document.getElementById("clearButton");
    const resultCount = document.getElementById("resultCount");
    const results = document.getElementById("results");
    const statusMessage = document.getElementById("statusMessage");
    const loadingIndicator = document.getElementById("loadingIndicator");

    /*
     * ชื่อคอลัมน์ที่ใช้:
     * region
     * team_name
     * district_th
     * subdistrict_th
     * province_en
     * subdistrict_en
     *
     * รองรับชื่อหัวคอลัมน์ที่มีตัวพิมพ์ใหญ่/เล็กต่างกัน
     * และรองรับข้อมูลที่ API ส่งมาเป็น array หรือ { data: [...] }
     */
    function getField(row, fieldName) {
      if (!row || typeof row !== "object") return "";

      const wanted = normalizeKey(fieldName);
      const actualKey = Object.keys(row).find(
        key => normalizeKey(key) === wanted
      );

      return actualKey == null ? "" : String(row[actualKey] ?? "").trim();
    }

    function normalizeKey(value) {
      return String(value ?? "")
        .toLowerCase()
        .replace(/[\s_\-]/g, "");
    }

    function normalizeText(value) {
      return String(value ?? "")
        .normalize("NFC")
        .toLowerCase()
        .replace(/[๐-๙]/g, digit =>
          String("๐๑๒๓๔๕๖๗๘๙".indexOf(digit))
        )
        .replace(/[.,;:()[\]{}]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function unique(values) {
      return [...new Set(values.filter(Boolean))];
    }

    function showMessage(message, type = "") {
      statusMessage.textContent = message;
      statusMessage.className = "status-message";

      if (type) {
        statusMessage.classList.add(type);
      }
    }

    function setLoading(isLoading) {
      loadingIndicator.style.display = isLoading ? "flex" : "none";
      searchButton.disabled = isLoading;
    }

    function getRegion(row) {
      return getField(row, "region");
    }

    function getTeam(row) {
      return getField(row, "team_name");
    }

    function getDistrict(row) {
      return getField(row, "district_th");
    }

    function getSubdistrict(row) {
      return getField(row, "subdistrict_th");
    }

    function getProvince(row) {
      return getField(row, "province_en");
    }

    /*
     * โหลดข้อมูลจาก Google Apps Script
     */
    async function loadData() {
      setLoading(true);
      resultCount.textContent = "กำลังโหลดข้อมูล...";
      results.innerHTML = "";

      if (
        !API_URL ||
        API_URL.includes("ใส่_URL") ||
        !API_URL.startsWith("https://")
      ) {
        setLoading(false);
        resultCount.textContent = "ยังไม่ได้ตั้งค่า URL";
        showMessage(
          "กรุณาใส่ URL ของ Google Apps Script Web App เดิมในตัวแปร API_URL ก่อนใช้งาน",
          "error"
        );
        return;
      }

      try {
        const response = await fetch(API_URL, {
          method: "GET",
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const payload = await response.json();

        let rows;

        if (Array.isArray(payload)) {
          rows = payload;
        } else if (Array.isArray(payload.data)) {
          rows = payload.data;
        } else if (Array.isArray(payload.records)) {
          rows = payload.records;
        } else {
          throw new Error("รูปแบบข้อมูลจาก API ไม่ใช่รายการข้อมูลที่รองรับ");
        }

        allData = rows.filter(row =>
          getRegion(row) ||
          getTeam(row) ||
          getDistrict(row) ||
          getSubdistrict(row)
        );

        populateRegionOptions();
        applyFilters();

        showMessage(
          "โหลดข้อมูลสำเร็จ " +
          allData.length.toLocaleString("th-TH") +
          " รายการ",
          "success"
        );
      } catch (error) {
        console.error("Load data error:", error);
        allData = [];
        filteredData = [];
        resultCount.textContent = "โหลดข้อมูลไม่สำเร็จ";
        results.innerHTML = "";

        showMessage(
          "เชื่อมต่อข้อมูลไม่สำเร็จ กรุณาตรวจสอบ URL ของ Apps Script, สิทธิ์การเข้าถึง Web App และรูปแบบข้อมูลที่ส่งกลับ",
          "error"
        );
      } finally {
        setLoading(false);
      }
    }

    function populateRegionOptions() {
      const currentValue = regionFilter.value;

      const regions = unique(
        allData.map(getRegion)
      ).sort((a, b) => a.localeCompare(b, "th"));

      regionFilter.innerHTML = "";

      const defaultOption = document.createElement("option");
      defaultOption.value = "";
      defaultOption.textContent = "ทุก Region";
      regionFilter.appendChild(defaultOption);

      regions.forEach(region => {
        const option = document.createElement("option");
        option.value = region;
        option.textContent = region;
        regionFilter.appendChild(option);
      });

      if (regions.includes(currentValue)) {
        regionFilter.value = currentValue;
      }
    }

    /*
     * แปลงที่อยู่เป็นคำค้นพื้นที่
     *
     * หลักการ:
     * 1. อ่านชื่ออำเภอ/เขตและตำบล/แขวงจากคำกำกับ หากมี
     * 2. หากไม่มีคำกำกับ ให้เทียบกับชื่อพื้นที่ที่มีจริงใน Google Sheets
     * 3. ใช้ชื่อที่ตรงกันและยาวที่สุดก่อน เพื่อลดการจับคู่ผิด
     * 4. ไม่ใช้เลขไปรษณีย์เป็นตัวกรอง เพราะชีตปัจจุบันไม่มีคอลัมน์รหัสไปรษณีย์
     */
    function parseAddress(address) {
      const original = String(address ?? "").trim();
      const normalized = normalizeText(original);

      const parsed = {
        district: "",
        subdistrict: "",
        province: "",
        matchedFields: [],
        isAddress: Boolean(original)
      };

      if (!normalized) return parsed;

      // กรณีมีคำกำกับอำเภอ/เขต
      const districtMatch = original.match(
        /(?:เขต|อำเภอ|อ\.|อำ\.?)\s*([ก-๙A-Za-zเ-๛]+(?:\s+[ก-๙A-Za-zเ-๛]+){0,2})/
      );

      if (districtMatch) {
        parsed.district = districtMatch[1].trim();
      }

      // กรณีมีคำกำกับตำบล/แขวง
      const subdistrictMatch = original.match(
        /(?:แขวง|ตำบล|ต\.|ตบ\.?)\s*([ก-๙A-Za-zเ-๛]+(?:\s+[ก-๙A-Za-zเ-๛]+){0,2})/
      );

      if (subdistrictMatch) {
        parsed.subdistrict = subdistrictMatch[1].trim();
      }

      // กรณีมีชื่อจังหวัดนำด้วย จ. หรือ จังหวัด
      const provinceMatch = original.match(
        /(?:จังหวัด|จ\.)\s*([ก-๙A-Za-zเ-๛]+(?:\s+[ก-๙A-Za-zเ-๛]+){0,2})/
      );

      if (provinceMatch) {
        parsed.province = provinceMatch[1].trim();
      }

      return parsed;
    }

    /*
     * ค้นหาชื่อพื้นที่จากค่าจริงในฐานข้อมูล
     * ใช้ข้อมูลในชีต ไม่ได้กำหนดรายชื่ออำเภอหรือตำบลไว้ตายตัว
     */
    function findAreaMatches(address, fieldGetter) {
      const text = normalizeText(address);
      if (!text) return [];

      const candidates = unique(allData.map(fieldGetter))
        .map(name => ({
          name,
          normalized: normalizeText(name)
        }))
        .filter(item =>
          item.normalized.length >= 2 &&
          text.includes(item.normalized)
        )
        .sort((a, b) => b.normalized.length - a.normalized.length);

      const selected = [];

      for (const candidate of candidates) {
        // หลีกเลี่ยงการเลือกชื่อสั้นที่เป็นส่วนหนึ่งของชื่อที่ยาวกว่า
        const coveredByLonger = selected.some(item =>
          item.normalized.includes(candidate.normalized)
        );

        if (!coveredByLonger) {
          selected.push(candidate);
        }
      }

      return selected;
    }

    /*
     * ตรวจหาพื้นที่จากที่อยู่
     */
    function resolveAddress(address) {
      const parsed = parseAddress(address);

      if (!parsed.isAddress) {
        return {
          active: false,
          valid: true,
          district: "",
          subdistrict: "",
          province: "",
          message: ""
        };
      }

      const districts = findAreaMatches(address, getDistrict);
      const subdistricts = findAreaMatches(address, getSubdistrict);
      const provinces = findAreaMatches(address, getProvince);

      // คำกำกับมีความน่าเชื่อถือกว่าการเดาจากชื่อที่อยู่
      const district = parsed.district ||
        (districts.length ? districts[0].name : "");

      const subdistrict = parsed.subdistrict ||
        (subdistricts.length ? subdistricts[0].name : "");

      const province = parsed.province ||
        (provinces.length ? provinces[0].name : "");

      const hasAnyArea = Boolean(district || subdistrict || province);

      if (!hasAnyArea) {
        return {
          active: true,
          valid: false,
          district: "",
          subdistrict: "",
          province: "",
          message:
            "ยังไม่พบชื่ออำเภอ/เขต ตำบล/แขวง หรือจังหวัดจากที่อยู่นี้ จึงไม่ได้แสดงข้อมูลทั้งหมด กรุณาตรวจสอบการสะกดหรือกรอกชื่ออำเภอ/ตำบลในช่องค้นหาแยก"
        };
      }

      return {
        active: true,
        valid: true,
        district,
        subdistrict,
        province,
        message:
          "พื้นที่ที่ตรวจพบ: " +
          [
            subdistrict ? "ตำบล/แขวง " + subdistrict : "",
            district ? "อำเภอ/เขต " + district : "",
            province ? "จังหวัด/พื้นที่ " + province : ""
          ].filter(Boolean).join(" • ")
      };
    }

    /*
     * กรองข้อมูล
     *
     * ถ้าพิมพ์ที่อยู่แล้วอ่านพื้นที่ไม่ออก จะไม่คืนข้อมูลทุกทีม
     */
    function applyFilters() {
      if (!allData.length) {
        filteredData = [];
        renderResults();
        return;
      }

      const address = addressInput.value.trim();
      const selectedRegion = normalizeText(regionFilter.value);
      const manualDistrict = normalizeText(districtFilter.value);
      const manualSubdistrict = normalizeText(subdistrictFilter.value);

      const resolved = resolveAddress(address);

      if (resolved.active && !resolved.valid) {
        filteredData = [];
        renderResults();
        showMessage(resolved.message, "error");
        return;
      }

      const addressDistrict = normalizeText(resolved.district);
      const addressSubdistrict = normalizeText(resolved.subdistrict);
      const addressProvince = normalizeText(resolved.province);

      filteredData = allData.filter(row => {
        const region = normalizeText(getRegion(row));
        const district = normalizeText(getDistrict(row));
        const subdistrict = normalizeText(getSubdistrict(row));
        const province = normalizeText(getProvince(row));

        if (selectedRegion && region !== selectedRegion) {
          return false;
        }

        if (
          manualDistrict &&
          !district.includes(manualDistrict)
        ) {
          return false;
        }

        if (
          manualSubdistrict &&
          !subdistrict.includes(manualSubdistrict)
        ) {
          return false;
        }

        if (
          addressDistrict &&
          district !== addressDistrict
        ) {
          return false;
        }

        if (
          addressSubdistrict &&
          subdistrict !== addressSubdistrict
        ) {
          return false;
        }

        if (
          addressProvince &&
          province !== addressProvince
        ) {
          return false;
        }

        return true;
      });

      renderResults();

      if (resolved.active && resolved.valid) {
        if (filteredData.length) {
          showMessage(
            resolved.message +
            " — พบข้อมูล " +
            filteredData.length.toLocaleString("th-TH") +
            " รายการ",
            "success"
          );
        } else {
          showMessage(
            resolved.message +
            " — ไม่พบรายการที่ตรงกันในฐานข้อมูล กรุณาตรวจสอบชื่อพื้นที่",
            "error"
          );
        }
      } else {
        showMessage(
          "แสดงผล " +
          filteredData.length.toLocaleString("th-TH") +
          " รายการตามตัวกรองที่เลือก"
        );
      }
    }

    /*
     * จัดกลุ่มรายการตามทีม
     */
    function renderResults() {
      results.innerHTML = "";

      const teams = new Map();

      filteredData.forEach(row => {
        const team = getTeam(row) || "ไม่ระบุทีม";
        const region = getRegion(row);

        if (!teams.has(team)) {
          teams.set(team, {
            team,
            region,
            areas: new Set()
          });
        }

        const item = teams.get(team);

        if (!item.region && region) {
          item.region = region;
        }

        const district = getDistrict(row);
        const subdistrict = getSubdistrict(row);

        const area = [
          subdistrict,
          district
        ].filter(Boolean).join(" / ");

        if (area) {
          item.areas.add(area);
        }
      });

      const teamList = [...teams.values()].sort((a, b) =>
        a.team.localeCompare(b.team, "th")
      );

      resultCount.textContent =
        "พบ " +
        teamList.length.toLocaleString("th-TH") +
        " ทีม";

      if (!teamList.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.style.gridColumn = "1 / -1";
        empty.textContent =
          "ไม่พบข้อมูลที่ตรงกัน ลองตรวจสอบชื่อพื้นที่หรือปรับตัวกรองอีกครั้ง";
        results.appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();

      teamList.forEach(item => {
        const card = document.createElement("article");
        card.className = "team-card";

        const titleRow = document.createElement("div");
        titleRow.className = "team-title";

        const heading = document.createElement("h3");
        heading.textContent = item.team;

        titleRow.appendChild(heading);

        if (item.region) {
          const region = document.createElement("span");
          region.className = "region-tag";
          region.textContent = item.region;
          titleRow.appendChild(region);
        }

        card.appendChild(titleRow);

        const areaList = document.createElement("ul");
        areaList.className = "area-list";

        const areas = [...item.areas].sort((a, b) =>
          a.localeCompare(b, "th")
        );

        if (!areas.length) {
          const li = document.createElement("li");
          li.textContent = "ไม่มีข้อมูลพื้นที่";
          areaList.appendChild(li);
        } else {
          areas.forEach(area => {
            const li = document.createElement("li");
            li.textContent = area;
            areaList.appendChild(li);
          });
        }

        card.appendChild(areaList);
        fragment.appendChild(card);
      });

      results.appendChild(fragment);
    }

    function clearFilters() {
      addressInput.value = "";
      regionFilter.value = "";
      districtFilter.value = "";
      subdistrictFilter.value = "";

      applyFilters();
    }

    searchButton.addEventListener("click", applyFilters);
    clearButton.addEventListener("click", clearFilters);

    addressInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        applyFilters();
      }
    });

    districtFilter.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        applyFilters();
      }
    });

    subdistrictFilter.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        applyFilters();
      }
    });

    regionFilter.addEventListener("change", applyFilters);

    // โหลดข้อมูลเมื่อเปิดหน้า
    loadData();
  </script>
</body>
</html>
